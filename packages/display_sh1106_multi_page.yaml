font:
  - file: "fonts/IBM-EGA-8x14.ttf"
    id: ibm_ega
    # The 14-pixel glyphs occupy a 16-pixel bitmap strike.
    size: 16
    glyphs: '!"%()+=,-_.:°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz/µ³'
  - file: "fonts/ProFont-11.bdf"
    id: profont_11
    size: 11
    glyphs: '!"%()+=,-_.:°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz/µ³'
  - file: "fonts/Inter-SemiBold-ss01.ttf"
    id: inter_20
    size: 20
    glyphs: '!"%()+=,-_.:°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz/µ³'
  - file: "fonts/Inter-SemiBold-ss01.ttf"
    id: inter_28
    size: 28
    glyphs: '!"%()+=,-_.:°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz/µ³'


binary_sensor:
  # True if and only if at least one non-blank page switch is on.
  # Any new page switches should be added here
  - platform: template
    id: any_non_blank_page_enabled
    internal: True
    lambda: |-
      return id(display_ag_default_page).state
          || id(display_boot_page).state
          || id(display_summary_pages).state
          || id(display_huge_no_units_page).state
          || id(display_air_quality_page).state
          || id(display_air_temp_page).state
          || id(display_voc_page).state
          || id(display_combo_page).state;


display:
  - platform: ssd1306_i2c
    # https://esphome.io/components/display/ssd1306.html
    # Formatting reference: https://www.tutorialspoint.com/c_standard_library/c_function_printf.htm
    model: "SH1106 128x64"
    id: oled_display
    address: 0x3C
    # rotation: 180°
    pages:
      - id: airgradient_default
        # https://forum.airgradient.com/t/airgradient-one-customized-mallocarray-esphome-display/1328
        lambda: |-
          bool show_f = id(display_in_f).state;
          bool show_dew = id(display_dewpoint).state;
          float hum_dew = show_dew ? (show_f ? id(dewpoint).state*9.0/5.0+32.0 : id(dewpoint).state) : id(humidity).state;
          if (show_f) {
            it.printf(2, 14, id(ibm_ega), TextAlign::BASELINE_LEFT, "%.1f°F", id(temp).state*9.0/5.0+32.0);
          } else {
            it.printf(2, 14, id(ibm_ega), TextAlign::BASELINE_LEFT, "%.1f°C", id(temp).state);
          }
          it.printf(126, 14, id(ibm_ega), TextAlign::BASELINE_RIGHT, show_dew ? (show_f ? "%.1f°F" : "%.1f°C") : "%.1f%%", hum_dew);
          it.line(0,17,128,17);
          it.printf(2, 27, id(profont_11), TextAlign::BASELINE_LEFT, "CO2");
          it.printf(2, 48, id(inter_20), TextAlign::BASELINE_LEFT, "%.0f", id(co2).state);
          it.printf(2, 61, id(profont_11), TextAlign::BASELINE_LEFT, "ppm");
          it.line(50,19,50,64);
          it.printf(54, 27, id(profont_11), TextAlign::BASELINE_LEFT, "PM2.5");
          it.printf(54, 48, id(inter_20), TextAlign::BASELINE_LEFT, "%.0f", id(pm_2_5).state);
          it.printf(54, 61, id(profont_11), TextAlign::BASELINE_LEFT, "µg/m³");
          it.line(100,19,100,64);
          it.printf(102, 26, id(profont_11), TextAlign::BASELINE_LEFT, "TVOC");
          it.printf(102, 38, id(profont_11), TextAlign::BASELINE_LEFT, "%.0f", id(voc).state);
          it.printf(102, 49, id(profont_11), TextAlign::BASELINE_LEFT, "NOx");
          it.printf(102, 61, id(profont_11), TextAlign::BASELINE_LEFT, "%.0f", id(nox).state);
      - id: boot
        lambda: |-
          it.printf(2, 12, id(profont_11), TextAlign::BASELINE_LEFT, "ID:");
          it.printf(126, 12, id(profont_11), TextAlign::BASELINE_RIGHT, "%s", get_mac_address().c_str());
          it.printf(2, 32, id(profont_11), TextAlign::BASELINE_LEFT, "Config Ver: $config_version");
          it.printf(2, 52, id(profont_11), TextAlign::BASELINE_LEFT, "$friendly_name");
      - id: summary1
        lambda: |-
          bool show_f = id(display_in_f).state;
          bool show_dew = id(display_dewpoint).state;
          float hum_dew = show_dew ? (show_f ? id(dewpoint).state*9.0/5.0+32.0 : id(dewpoint).state) : id(humidity).state;
          it.printf(2, 12, id(profont_11), TextAlign::BASELINE_LEFT, "CO2:");
          it.printf(126, 12, id(ibm_ega), TextAlign::BASELINE_RIGHT, "%.0f ppm", id(co2).state);
          it.printf(2, 28, id(profont_11), TextAlign::BASELINE_LEFT, "PM2.5:");
          it.printf(126, 28, id(ibm_ega), TextAlign::BASELINE_RIGHT, "%.0f µg/m³", id(pm_2_5).state);
          it.printf(2, 44, id(profont_11), TextAlign::BASELINE_LEFT, "Temp:");
          if (show_f) {
            it.printf(126, 44, id(ibm_ega), TextAlign::BASELINE_RIGHT, "%.1f°F", id(temp).state*9.0/5.0+32.0);
          } else {
            it.printf(126, 44, id(ibm_ega), TextAlign::BASELINE_RIGHT, "%.1f°C", id(temp).state);
          }
          it.printf(2, 60, id(profont_11), TextAlign::BASELINE_LEFT, show_dew ? "Dewpoint:" : "Humidity:");
          it.printf(126, 60, id(ibm_ega), TextAlign::BASELINE_RIGHT, show_dew ? (show_f ? "%.1f°F" : "%.1f°C") : "%.1f%%", hum_dew);
      - id: summary2
        lambda: |-
          it.printf(2, 12, id(profont_11), TextAlign::BASELINE_LEFT, "CO2:");
          it.printf(126, 12, id(ibm_ega), TextAlign::BASELINE_RIGHT, "%.0f ppm", id(co2).state);
          it.printf(2, 28, id(profont_11), TextAlign::BASELINE_LEFT, "PM2.5:");
          it.printf(126, 28, id(ibm_ega), TextAlign::BASELINE_RIGHT, "%.0f µg/m³", id(pm_2_5).state);
          it.printf(2, 44, id(profont_11), TextAlign::BASELINE_LEFT, "VOC:");
          it.printf(126, 44, id(ibm_ega), TextAlign::BASELINE_RIGHT, "%.0f", id(voc).state);
          it.printf(2, 60, id(profont_11), TextAlign::BASELINE_LEFT, "NOx:");
          it.printf(126, 60, id(ibm_ega), TextAlign::BASELINE_RIGHT, "%.0f", id(nox).state);
      - id: huge_no_units
        lambda: |-
          bool show_f = id(display_in_f).state;
          float hum_dew = id(display_dewpoint).state ? (show_f ? id(dewpoint).state*9.0/5.0+32.0 : id(dewpoint).state) : id(humidity).state;
          it.printf(2, 26, id(inter_28), TextAlign::BASELINE_LEFT, "%.0f", id(co2).state);
          it.printf(it.get_width() - 2, 26, id(inter_28), TextAlign::BASELINE_RIGHT, "%.0f", hum_dew);
          it.printf(2, 58, id(inter_28), TextAlign::BASELINE_LEFT, "%.0f", id(pm_2_5).state);
          if (show_f) {
            it.printf(it.get_width() - 2, 58, id(inter_28), TextAlign::BASELINE_RIGHT, "%.1f", id(temp).state*9.0/5.0+32.0);
          } else {
            it.printf(it.get_width() - 2, 58, id(inter_28), TextAlign::BASELINE_RIGHT, "%.1f", id(temp).state);
          }
      - id: air_quality
        lambda: |-
          it.printf(2, 26, id(profont_11), TextAlign::BASELINE_LEFT, "CO2");
          it.printf(126, 26, id(inter_20), TextAlign::BASELINE_RIGHT, "%.0f ppm", id(co2).state);
          it.printf(2, 54, id(profont_11), TextAlign::BASELINE_LEFT, "PM2");
          it.printf(126, 54, id(inter_20), TextAlign::BASELINE_RIGHT, "%.0f µg/m³", id(pm_2_5).state);
      - id: air_temp
        lambda: |-
          bool show_f = id(display_in_f).state;
          bool show_dew = id(display_dewpoint).state;
          float hum_dew = show_dew ? (show_f ? id(dewpoint).state*9.0/5.0+32.0 : id(dewpoint).state) : id(humidity).state;
          it.printf(2, 26, id(profont_11), TextAlign::BASELINE_LEFT, "Temp");
          if (show_f) {
            it.printf(126, 26, id(inter_20), TextAlign::BASELINE_RIGHT, "%.1f°F", id(temp).state*9.0/5.0+32.0);
          } else {
            it.printf(126, 26, id(inter_20), TextAlign::BASELINE_RIGHT, "%.1f°C", id(temp).state);
          }
          it.printf(2, 54, id(profont_11), TextAlign::BASELINE_LEFT, show_dew ? "Dew" : "Humid");
          it.printf(126, 54, id(inter_20), TextAlign::BASELINE_RIGHT, show_dew ? (show_f ? "%.1f°F" : "%.1f°C") : "%.1f%%", hum_dew);
      - id: air_voc
        lambda: |-
          it.printf(2, 26, id(profont_11), TextAlign::BASELINE_LEFT, "VOC:");
          it.printf(126, 26, id(inter_20), TextAlign::BASELINE_RIGHT, "%.0f", id(voc).state);
          it.printf(2, 54, id(profont_11), TextAlign::BASELINE_LEFT, "NOx:");
          it.printf(126, 54, id(inter_20), TextAlign::BASELINE_RIGHT, "%.0f", id(nox).state);
      - id: combo
        lambda: |-
          bool show_f = id(display_in_f).state;
          bool show_dew = id(display_dewpoint).state;
          float hum_dew = show_dew ? (show_f ? id(dewpoint).state*9.0/5.0+32.0 : id(dewpoint).state) : id(humidity).state;
          if (show_f) {
            it.printf(2, 12, id(profont_11), TextAlign::BASELINE_LEFT, "%.1f °F", id(temp).state*9.0/5.0+32.0);
          } else {
            it.printf(2, 12, id(profont_11), TextAlign::BASELINE_LEFT, "%.1f °C", id(temp).state);
          }
          it.printf(126, 12, id(profont_11), TextAlign::BASELINE_RIGHT, show_dew ? (show_f ? "%.1f°F" : "%.1f°C") : "%.1f%%", hum_dew);
          it.printf(2, 28, id(profont_11), TextAlign::BASELINE_LEFT, "%.0f µg/m³", id(pm_2_5).state);
          it.printf(126, 28, id(profont_11), TextAlign::BASELINE_RIGHT, "%.0f ppm", id(co2).state);
          it.printf(2, 44, id(profont_11), TextAlign::BASELINE_LEFT, "VOC: %.0f", id(voc).state);
          it.printf(126, 44, id(profont_11), TextAlign::BASELINE_RIGHT, "NOx: %.0f", id(nox).state);
          it.printf(2, 60, id(profont_11), TextAlign::BASELINE_LEFT, "AQI: %.0f", id(pm_2_5_aqi).state);
      - id: blank
        lambda: |-
          it.printf(2, 12, id(profont_11), TextAlign::BASELINE_LEFT, " ");

    on_page_change:
      - to: airgradient_default
        then:
          - if:
              condition:
                switch.is_off: display_ag_default_page
              then:
                - display.page.show_next: oled_display
                - component.update: oled_display
      - to: summary1
        then:
          - if:
              condition:
                switch.is_off: display_summary_pages
              then:
                - display.page.show_next: oled_display
                - component.update: oled_display
      - to: summary2
        then:
          - if:
              condition:
                switch.is_off: display_summary_pages
              then:
                - display.page.show_next: oled_display
                - component.update: oled_display
      - to: air_quality
        then:
          - if:
              condition:
                switch.is_off: display_air_quality_page
              then:
                - display.page.show_next: oled_display
                - component.update: oled_display
      - to: huge_no_units
        then:
          - if:
              condition:
                switch.is_off: display_huge_no_units_page
              then:
                - display.page.show_next: oled_display
                - component.update: oled_display
      - to: air_temp
        then:
          - if:
              condition:
                switch.is_off: display_air_temp_page
              then:
                - display.page.show_next: oled_display
                - component.update: oled_display
      - to: air_voc
        then:
          - if:
              condition:
                switch.is_off: display_voc_page
              then:
                - display.page.show_next: oled_display
                - component.update: oled_display
      - to: combo
        then:
          - if:
              condition:
                switch.is_off: display_combo_page
              then:
                - display.page.show_next: oled_display
                - component.update: oled_display
      - to: boot
        then:
          - if:
              condition:
                switch.is_off: display_boot_page
              then:
                - display.page.show_next: oled_display
                - component.update: oled_display
      - to: blank
        then:
          - if:
              # Only change pages if a page switch for a non-blank page is actually enabled;
              # acts as a base case to prevent recursive page change loop
              condition:
                and:
                  - switch.is_off: display_blank_page
                  - binary_sensor.is_on: any_non_blank_page_enabled
              then:
                - display.page.show_next: oled_display
                - component.update: oled_display


interval:
  - interval: 10s
    startup_delay: 1s
    # Show boot screen serial number and config version only when first starting up
    then:
      if:
        condition:
          switch.is_on: display_boot_page
        then:
          switch.turn_off: display_boot_page
  - interval: 5s
    # Automatically switch to the next page every five seconds if not set to blank
    then:
      - if:
          condition:
            and:
              - switch.is_off: display_blank_page
              - binary_sensor.is_on: any_non_blank_page_enabled
          then:
            - display.page.show_next: oled_display
            - component.update: oled_display
          else:
            - display.page.show: blank
            - component.update: oled_display


switch:
  - platform: template
    name: "Display Temperature in °F"
    id: display_in_f
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: True
    entity_category: config
    icon: "mdi:thermometer"

  - platform: template
    name: "Display AirGradient Default Page"
    id: display_ag_default_page
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: True
    entity_category: config
    icon: "mdi:monitor"

  - platform: template
    name: "Display Summary Pages"
    id: display_summary_pages
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: True
    entity_category: config
    icon: "mdi:monitor"

  - platform: template
    name: "Display Huge No Units Page"
    id: display_huge_no_units_page
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: True
    entity_category: config
    icon: "mdi:numeric"

  - platform: template
    name: "Display Air Quality Page"
    id: display_air_quality_page
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: True
    entity_category: config
    icon: "mdi:monitor"

  - platform: template
    name: "Display Temp-Hum Page"
    id: display_air_temp_page
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: True
    entity_category: config
    icon: "mdi:monitor"

  - platform: template
    name: "Display VOC Page"
    id: display_voc_page
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: True
    entity_category: config
    icon: "mdi:monitor"

  - platform: template
    name: "Display Combo Page"
    id: display_combo_page
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: True
    entity_category: config
    icon: "mdi:monitor"

  - platform: template
    name: "Display Boot Page"
    id: display_boot_page
    restore_mode: ALWAYS_ON
    optimistic: True
    entity_category: config
    icon: "mdi:monitor"

  - platform: template
    name: "Display Blank Page"
    id: display_blank_page
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: True
    entity_category: config
    icon: "mdi:monitor"
    on_turn_on:
      - display.page.show: blank
      - component.update: oled_display
    on_turn_off:
      - if:
          condition:
            binary_sensor.is_on: any_non_blank_page_enabled
          then:
            - display.page.show_next: oled_display
            - component.update: oled_display
          else:
            - display.page.show: blank
            - component.update: oled_display

number:
  - platform: template
    # https://esphome.io/components/number/template.html
    name: "Display Contrast %"
    icon: "mdi:lightbulb"
    id: display_contrast
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    optimistic: true
    restore_value: true
    mode: slider
    on_value:
      then:
        # https://www.reddit.com/r/Esphome/comments/sy1d1s/how_to_write_a_lamba_to_change_the_contrast_of/
        lambda: id(oled_display).set_contrast(id(display_contrast).state / 100.0);
    entity_category: config
